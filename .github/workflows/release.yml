name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @digimodoro/core build

      - name: Build app bundles
        working-directory: packages/app
        run: node esbuild.config.mjs

      - name: Package (mac arm64)
        if: matrix.target == 'mac'
        working-directory: packages/app
        # Build each arch sequentially. electron-builder's pkg target writes
        # to the same temp filename ('com.hendrix.digimodoro.pkg') for both
        # archs and crashes when the parallel arm64/x64 builds clash on it.
        run: pnpm exec electron-builder --mac --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (mac x64)
        if: matrix.target == 'mac'
        working-directory: packages/app
        run: pnpm exec electron-builder --mac --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (win)
        if: matrix.target == 'win'
        working-directory: packages/app
        run: pnpm exec electron-builder --win

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.dmg
            release/*.exe
          fail_on_unmatched_files: false
