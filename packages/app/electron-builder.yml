appId: com.hendrix.digimodoro
productName: DigiModoro
copyright: Copyright © 2026 Hendrix

directories:
  output: ../../release
  buildResources: build

# Single source-of-truth icon. electron-builder picks build/icon.png up
# automatically by convention; declaring it explicitly here keeps the intent
# obvious and avoids the "default Electron icon is used" warning.
icon: build/icon.png

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

# Ship only Korean + English locale packs. Default Electron bundle includes
# ~50 .pak files for every Chromium-supported language, most of which we
# never use. Trimming them shaves ~8 MB off the packaged app.
electronLanguages:
  - en-US
  - ko

extraResources:
  - from: ../data/evolution.json
    to: data/evolution.json
  - from: ../data/roster.json
    to: data/roster.json
  - from: ../data/sprites
    to: sprites
    filter:
      - "**/*"
      - "!_raw/**"

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  identity: null  # ad-hoc unsigned for local builds
  hardenedRuntime: false
  gatekeeperAssess: false
  # Drop the version from the filename so README direct-download links
  # ('/releases/latest/download/...') stay valid across versions.
  artifactName: ${productName}-mac-${arch}.${ext}

dmg:
  writeUpdateInfo: false
  # ULFO = LZFSE — Apple's modern compressor. Better ratio than the default
  # bzip2 format, with native macOS 10.11+ support (we already require 10.12+).
  format: ULFO

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
