name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @digimodoro/core build

      - name: Build app bundles
        working-directory: packages/app
        run: node esbuild.config.mjs

      - name: Package (mac arm64)
        if: matrix.target == 'mac'
        working-directory: packages/app
        # Build each arch sequentially. electron-builder's pkg target writes
        # to the same temp filename ('com.hendrix.digimodoro.pkg') for both
        # archs and crashes when the parallel arm64/x64 builds clash on it.
        run: pnpm exec electron-builder --mac --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (mac x64)
        if: matrix.target == 'mac'
        working-directory: packages/app
        run: pnpm exec electron-builder --mac --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (win)
        if: matrix.target == 'win'
        working-directory: packages/app
        run: pnpm exec electron-builder --win

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.dmg
            release/*.exe
          fail_on_unmatched_files: false

  update-cask:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Compute checksums and bump Cask formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/Hendrix1995/digimodoro/releases/download/${GITHUB_REF_NAME}"

          # Wait for both mac dmgs to be available (the matrix build step
          # above uploaded them, but Release assets can take a moment to
          # propagate through the CDN).
          for asset in DigiModoro-mac-arm64.dmg DigiModoro-mac-x64.dmg; do
            for i in $(seq 1 30); do
              if curl -fsSLo "/tmp/$asset" "$BASE/$asset"; then break; fi
              sleep 5
            done
          done

          SHA_ARM=$(shasum -a 256 /tmp/DigiModoro-mac-arm64.dmg | awk '{print $1}')
          SHA_X64=$(shasum -a 256 /tmp/DigiModoro-mac-x64.dmg | awk '{print $1}')

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Hendrix1995/homebrew-digimodoro.git" tap
          cd tap

          python3 - <<PY
          import re, pathlib
          p = pathlib.Path("Casks/digimodoro.rb")
          s = p.read_text()
          s = re.sub(r'version "[^"]+"', f'version "${VERSION}"', s, count=1)
          s = re.sub(r'(on_arm do\s+url[^\n]+\n\s+sha256 ")[0-9a-f]{64}', rf'\g<1>${SHA_ARM}', s)
          s = re.sub(r'(on_intel do\s+url[^\n]+\n\s+sha256 ")[0-9a-f]{64}', rf'\g<1>${SHA_X64}', s)
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/digimodoro.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git commit -m "Bump DigiModoro to ${VERSION}"
          git push
