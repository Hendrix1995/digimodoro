name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @digimodoro/core build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/app
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: DigiModoro v__VERSION__
          releaseBody: |
            ## Windows

            `.exe` 더블클릭 → SmartScreen 경고가 뜨면 **추가 정보 → 실행**.

            ## macOS

            `.dmg` 더블클릭 → `DigiModoro.app`을 **Applications** 폴더로 드래그.

            **macOS 14 (Sonoma) 이하**: Applications에서 앱 **우클릭 → 열기** → 경고 다이얼로그의 **「열기」** 클릭.

            **macOS 15 (Sequoia) 이상**: 더블클릭 → 경고 다이얼로그 **완료** → **시스템 설정 → 개인정보 보호 및 보안** → 아래쪽 차단 메시지 옆 **「그래도 열기」** → 인증 → 다시 뜨는 다이얼로그에서 **「열기」**.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          args: ${{ matrix.args }}
