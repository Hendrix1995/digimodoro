appId: com.hendrix.digimodoro
productName: DigiModoro
copyright: Copyright © 2026 Hendrix

directories:
  output: ../../release
  buildResources: build

# Single source-of-truth icon. electron-builder picks build/icon.png up
# automatically by convention; declaring it explicitly here keeps the intent
# obvious and avoids the "default Electron icon is used" warning.
icon: build/icon.png

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

# Ship only Korean + English locale packs. Default Electron bundle includes
# ~50 .pak files for every Chromium-supported language, most of which we
# never use. Trimming them shaves ~8 MB off the packaged app.
electronLanguages:
  - en-US
  - ko

extraResources:
  - from: ../data/evolution.json
    to: data/evolution.json
  - from: ../data/roster.json
    to: data/roster.json
  - from: ../data/sprites
    to: sprites
    filter:
      - "**/*"
      - "!_raw/**"

mac:
  target:
    # .pkg only. The postinstall script under build/pkg-scripts/ strips
    # com.apple.quarantine after install, giving non-developers a clean
    # double-click experience with no Terminal involvement.
    - target: pkg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  identity: null  # ad-hoc unsigned for local builds
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: ${productName}-mac-${arch}.${ext}

pkg:
  scripts: build/pkg-scripts
  installLocation: /Applications
  allowAnywhere: true
  allowCurrentUserHome: true
  allowRootDirectory: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
