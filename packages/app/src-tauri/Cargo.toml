[package]
name = "digimodoro"
version = "0.2.0"
description = "Digimon-themed virtual pet Pomodoro timer"
authors = ["Hendrix"]
edition = "2021"

[lib]
name = "digimodoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rand = "0.9"
