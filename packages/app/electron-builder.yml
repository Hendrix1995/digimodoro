appId: com.hendrix.digimodoro
productName: DigiModoro
copyright: Copyright © 2026 Hendrix

directories:
  output: ../../release
  buildResources: build

# Single source-of-truth icon. electron-builder picks build/icon.png up
# automatically by convention; declaring it explicitly here keeps the intent
# obvious and avoids the "default Electron icon is used" warning.
icon: build/icon.png

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

extraResources:
  - from: ../data/evolution.json
    to: data/evolution.json
  - from: ../data/roster.json
    to: data/roster.json
  - from: ../data/sprites
    to: sprites
    filter:
      - "**/*"
      - "!_raw/**"

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  identity: null  # ad-hoc unsigned for local builds
  hardenedRuntime: false
  gatekeeperAssess: false
  # Drop the version from the filename so README direct-download links
  # ('/releases/latest/download/...') stay valid across versions.
  artifactName: ${productName}-mac-${arch}.${ext}

dmg:
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
